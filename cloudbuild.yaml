steps:
  - name: hashicorp/terraform:1.6
    id: terraform-init
    dir: terraform
    args: ["init", "-input=false"]

  - name: hashicorp/terraform:1.6
    id: terraform-apply-infra
    dir: terraform
    args: ["apply", "-auto-approve"]
    env:
      - TF_VAR_project_id=$PROJECT_ID
      - TF_VAR_region=${_REGION}
      - TF_VAR_photo_bucket_name=${_PHOTO_BUCKET}
      - TF_VAR_thumbnail_bucket_name=${_THUMBNAIL_BUCKET}
      - TF_VAR_cors_origins=${_CORS_ORIGINS}

  - name: gcr.io/cloud-builders/gcloud
    id: deploy-function-api
    args:
      - functions
      - deploy
      - photo-album-api
      - --gen2
      - --region=${_REGION}
      - --runtime=python312
      - --source=functions/api
      - --entry-point=main
      - --trigger-http
      - --allow-unauthenticated
      - --service-account=${_FUNCTION_SERVICE_ACCOUNT}
      - --memory=512Mi
      - --timeout=60s
      - --set-env-vars=PHOTO_BUCKET=${_PHOTO_BUCKET},SERVICE_ACCOUNT_EMAIL=${_FUNCTION_SERVICE_ACCOUNT}

  - name: gcr.io/cloud-builders/gcloud
    id: deploy-function-thumbnail
    args:
      - functions
      - deploy
      - photo-thumbnail
      - --gen2
      - --region=${_REGION}
      - --runtime=python312
      - --source=functions/thumbnail
      - --entry-point=generate_thumbnail
      - --trigger-event-filters=type=google.cloud.storage.object.v1.finalized
      - --trigger-event-filters=bucket=${_PHOTO_BUCKET}
      - --service-account=${_FUNCTION_SERVICE_ACCOUNT}
      - --memory=1024Mi
      - --timeout=60s
      - --set-env-vars=THUMBNAIL_BUCKET=${_THUMBNAIL_BUCKET}

options:
  logging: CLOUD_LOGGING_ONLY
