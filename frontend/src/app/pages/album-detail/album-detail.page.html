<mat-card class="albums-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ albumTitle() }}</mat-card-title>
    <span class="spacer"></span>
    @if (isAdmin()) {
      <mat-icon fontIcon="add_box" (click)="uploadPhotos()"></mat-icon>
    }
  </mat-card-header>
  <mat-card-content>
    @if (loading()) {
      <p>Loading photos...</p>
    }
    @if (!loading() && photos().length === 0) {
      <p>No photos.</p>
    }
    @if (error()) {
      <p class="error">Failed to load photos</p>
    }
    @if (photos(); as list) {
      <mat-grid-list cols="4" rowHeight="1:1">
        @for (photo of list; track photo.id; let i = $index) {
          <mat-grid-tile (click)="openViewer(i)">
            <div class="thumb">
              <img [src]="'/thumb/' + (photo.thumbPath || 'placeholder.webp')" />
            </div>
          </mat-grid-tile>
        }
      </mat-grid-list>
    }
  </mat-card-content>
</mat-card>

<app-photo-viewer />
