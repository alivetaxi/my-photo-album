<div class="overlay" (click)="closeViewer()">
  <div class="viewer" (click)="$event.stopPropagation()">

    <button class="close" (click)="closeViewer()">✕</button>

    @if (hasPrev()) {
      <button class="nav left" (click)="prev()">‹</button>
    }
    
    <app-photo-viewer-image [photo]="currentPhoto()" />

    @if (hasNext()) {
      <button class="nav right" (click)="next()">›</button>
    }

  </div>
</div>
