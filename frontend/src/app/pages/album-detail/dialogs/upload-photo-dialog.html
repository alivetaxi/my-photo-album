<h2 mat-dialog-title>Upload Photo</h2>
<div class="dialog-body">
  <input type="file" #fileInput hidden multiple accept="image/*,video/*" (change)="onPhotosSelected($event)" />
  <button mat-raised-button color="primary" (click)="fileInput.click()">Select files</button>
  @if (photos().length > 0) {
    <p>{{ photos().length }} files selected</p>
  }
  @if (uploading()) {
    <mat-progress-bar mode="determinate" [value]="progress()"></mat-progress-bar>
  }
</div>
<mat-dialog-actions>
  <button matButton (click)="cancel()">Cancel</button>
  @if (photos().length > 0) {
    <button matButton (click)="upload()" [disabled]="uploading()">Upload</button>
  }
</mat-dialog-actions>
