<h1>Albums</h1>

@if (loading()) {
  <p>Loading...</p>
}

@if (error()) {
  <p class="error">{{ error() }}</p>
}

@if (albums(); as list) {
  <ul>
    @for (album of list; track album.id) {
      <li>
        <span (click)="open(album)">
          {{ album.title }}
        </span>

        @if (isAdmin()) {
          <button (click)="deleteAlbum(album)">Delete</button>
        }
      </li>
    }
  </ul>
}

@if (isAdmin()) {
  <button (click)="createAlbum()">Create Album</button>
}
